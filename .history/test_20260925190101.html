<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section & Category Bar Component</title>

    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           RESET & DESIGN TOKENS
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #dcfce7;
            --primary-bg: #f0fdf4;
            --text-main: #333333;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-md: 12px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            padding: 24px 0;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ==========================================
           HERO SECTION
           ========================================== */
        .hero-section {
            padding: 20px 0 60px;
            position: relative;
        }

        .hero-card {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 480px;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-lg);
            background-color: #1e293b;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 55%, rgba(0,0,0,0.1) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            padding: 48px;
            max-width: 650px;
            color: var(--white);
        }

        .hero-title {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .hero-subtitle {
            font-size: 18px;
            color: #a7f3d0;
            margin-bottom: 32px;
            font-weight: 300;
        }

        /* Button Styling */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: rgba(34, 197, 94, 0.9);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.4);
        }

        .btn-primary:hover {
            background-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.6);
        }

        /* ==========================================
           FLOATING CATEGORY BAR
           ========================================== */
        .category-floating-bar {
            position: relative;
            z-index: 20;
            max-width: 960px;
            margin: -60px auto 0;
            padding: 0 16px;
        }

        .category-grid {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-lg);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            text-decoration: none;
            transition: var(--transition);
        }

        .category-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .category-icon svg {
            width: 26px;
            height: 26px;
            fill: var(--primary);
            transition: var(--transition);
        }

        .category-item:hover .category-icon {
            background-color: var(--primary);
            transform: scale(1.1);
        }

        .category-item:hover .category-icon svg {
            fill: var(--white);
        }

        .category-label {
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            transition: var(--transition);
        }

        .category-item:hover .category-label {
            color: var(--primary);
        }

        /* ==========================================
           RESPONSIVE BREAKPOINTS
           ========================================== */
        @media (max-width: 992px) {
            .hero-title {
                font-size: 32px;
            }
            .hero-card {
                min-height: 400px;
            }
            .category-grid {
                gap: 8px;
                padding: 16px 8px;
            }
            .category-icon {
                width: 46px;
                height: 46px;
            }
            .category-icon svg {
                width: 20px;
                height: 20px;
            }
            .category-label {
                font-size: 11px;
            }
        }

        @media (max-width: 768px) {
            .hero-content {
                padding: 32px 24px;
            }
            .hero-title {
                font-size: 26px;
            }
            .hero-subtitle {
                font-size: 14px;
                margin-bottom: 24px;
            }
            .category-floating-bar {
                margin-top: -40px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- HERO SECTION -->
        <section class="hero-section">
            <div class="hero-card">
                <img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?q=80&w=1600&auto=format&fit=crop" 
                     alt="Thai Farmer Background" 
                     class="hero-bg"
                     onerror="this.onerror=null; this.src='https://placehold.co/1600x900/15803d/ffffff?text=Agricultural+Knowledge';">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <h1 class="hero-title">เกษตรไทยยั่งยืน<br>เริ่มต้นได้ที่นี่</h1>
                    <p class="hero-subtitle">ความรู้ • เทคโนโลยี • 3 ห่วง 2 เงื่อนไข</p>
                    <a href="#" class="btn btn-primary">
                        <span>เรียนรู้เพิ่มเติม</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </a>
                </div>
            </div>

            <!-- FLOATING CATEGORY BAR -->
            <div class="category-floating-bar">
                <div class="category-grid">
                    <!-- Category 1: Sprout -->
                    <a href="#" class="category-item">
                        <div class="category-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                        </div>
                        <span class="category-label">เกษตรกรยุคใหม่</span>
                    </a>
                    <!-- Category 2: Water Drop -->
                    <a href="#" class="category-item">
                        <div class="category-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                        </div>
                        <span class="category-label">จัดการน้ำ</span>
                    </a>
                    <!-- Category 3: Tech/Gear -->
                    <a href="#" class="category-item">
                        <div class="category-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V18h-2v-1.07A6 6 0 0 1 5.07 13H4v-2h1.07A6 6 0 0 1 11 5.07V4h2v1.07A6 6 0 0 1 18.93 11H20v2h-1.07A6 6 0 0 1 13 16.93z"/></svg>
                        </div>
                        <span class="category-label">เทคโนโลยี</span>
                    </a>
                    <!-- Category 4: Circled Nodes -->
                    <a href="#" class="category-item">
                        <div class="category-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9c0 4.17 2.84 7.67 6.69 8.69L12 22l2.31-2.31C18.16 18.67 21 15.17 21 11a9 9 0 0 0-9-9z"/></svg>
                        </div>
                        <span class="category-label">3 ห่วง 2 เงื่อนไข</span>
                    </a>
                    <!-- Category 5: Tools/Wrench -->
                    <a href="#" class="category-item">
                        <div class="category-icon">
                            <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.6C.4 7 1 10 3 12c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.4-.4.4-1.1 0-1.3z"/></svg>
                        </div>
                        <span class="category-label">เครื่องมือ</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
